name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r v1/requirements.txt
      - run: python -m unittest discover -s v1 -p "test_*.py" -v
      - run: node --check v1/local_scrape.js
